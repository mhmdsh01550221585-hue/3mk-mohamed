<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3mk mhmd</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #5a67d8;
      margin-bottom: 15px;
      font-size: 28px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    button {
      background: #5a67d8;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #434190;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1> اهلا ينيكه</h1><p> دي صفحه عمك محمد</p>
    <button>اتناك بعيد</button>
  </div>
</body>
</html>
